<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCENT Connector v2 Playground</title>
  <style>
    /* index-v2.html <style> 상단 — 🔴 브랜드 앵커 블록(:root BRAND-ANCHOR)과 별개다.
       playground 지역 표면 토큰이며 parity 대조 대상이 아니다(9키 앵커가 아니므로).
       🔴 단 G1(scripts/check-index-html-brand-tokens.mjs)은 다르다 — G1은 hue/chroma로
       판단하므로 --pg-selected는 브랜드 앵커 색과 hue가 같아(둘 다 약 243도) 하드코딩으로
       잡힌다. REPO_G1_EXCEPTIONS['index-v2.html']에 등록되어 있다. */
    :root {
      --pg-bg:       #0f172a;  /* 기존 로그 패널 값 */
      --pg-panel:    #1e1e2e;  /* 기존 헤더 값 */
      --pg-raised:   #2a2a3e;  /* 기존 셀렉트 값 */
      --pg-border:   #334155;  /* 기존 경계 값 */
      --pg-fg:       #e2e8f0;  /* 기존 전경 값 */
      --pg-muted:    #94a3b8;  /* 기존 로그 패널 muted 값(:208 :217 :241) — 재사용.
                                   이전 회색 잉크는 --pg-bg 위 5.04 로 통과하지만
                                   --pg-raised(:167 read-only) 위에서 3.95 로 떨어진다(§4-3) */
      --pg-selected: #312e63;  /* 🆕 유일한 신규 — 이전 선택 배경(연한 인디고)의 다크 대응.
                                   indigo 계열 유지(02 가 hue 를 바꾼다) */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      background: var(--pg-bg);
      color: var(--pg-fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Sticky Header (Device Indicator) ── */
    #header {
      background: #1e1e2e;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    #header h1 { font-size: 16px; font-weight: 600; flex: 1; }
    #conn-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--pg-muted);
      flex-shrink: 0;
    }
    #conn-dot.connected { background: #4ade80; }
    #conn-dot.error { background: #f87171; }
    #device-info { font-size: 12px; color: #aaa; flex: 1; }
    #btn-connect, #btn-disconnect {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #btn-connect { background: #4f46e5; color: #fff; }
    #btn-connect:hover { background: #4338ca; }
    #btn-connect:disabled { background: #666; cursor: not-allowed; }
    #btn-disconnect { background: #dc2626; color: #fff; display: none; }
    #btn-disconnect:hover { background: #b91c1c; }

    /* ── Transport selector (m09-04-03) ── */
    #transport-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aaa;
    }
    #transport-selector label { color: #aaa; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    #transport-selector select {
      background: #2a2a3e;
      color: #e2e8f0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
    }
    #transport-selector select:focus { outline: none; border-color: #4f46e5; }

    /* ── Main layout: sidebar + log panel ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left sidebar: tree + form ── */
    #sidebar {
      flex: 3;
      min-width: 360px;
      background: var(--pg-panel);
      border-right: 1px solid var(--pg-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tree */
    #tree-panel {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .tree-group-label {
      padding: 6px 12px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pg-muted);
    }
    .tree-family-label {
      padding: 4px 16px 2px;
      font-size: 11px;
      color: #aaa;
      font-style: italic;
    }
    .tree-item {
      padding: 7px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
      font-size: 13px;
    }
    .tree-item:hover { background: var(--pg-raised); }
    .tree-item.selected {
      background: var(--pg-selected);
      border-left-color: #4f46e5;
      color: #4f46e5;
      font-weight: 600;
    }

    /* Form (bottom of sidebar) */
    #form-panel {
      border-top: 1px solid var(--pg-border);
      padding: 12px;
      flex-shrink: 0;
      max-height: 340px;
      overflow-y: auto;
    }
    #form-panel h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pg-muted);
      margin-bottom: 10px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }
    .form-row label {
      font-size: 11px;
      font-weight: 600;
      color: var(--pg-fg);
      margin-bottom: 3px;
    }
    .form-row input,
    .form-row select,
    .form-row textarea {
      padding: 5px 8px;
      border: 1px solid var(--pg-border);
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-row input:read-only { background: var(--pg-raised); color: var(--pg-muted); }
    .form-row input.error { border-color: #dc2626; }
    .field-error {
      font-size: 11px;
      color: #dc2626;
      margin-top: 2px;
    }
    #btn-send {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }
    #btn-send:hover { background: #4338ca; }
    #btn-send:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ── Right: Log panel ── */
    #log-area {
      flex: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #1a1a2e;
    }
    #log-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    #log-toolbar span {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      flex: 1;
    }
    #log-toolbar button {
      padding: 4px 10px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
    }
    #log-toolbar button:hover { background: #334155; color: #e2e8f0; }
    #log-toolbar button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    #log-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #e2e8f0;
    }
    .log-entry {
      margin-bottom: 12px;
      border-left: 3px solid #334155;
      padding-left: 10px;
    }
    .log-entry.success { border-left-color: #4ade80; }
    .log-entry.error { border-left-color: #f87171; }
    .log-entry.info { border-left-color: #60a5fa; }
    .log-ts { font-size: 10px; color: #64748b; }
    .log-method { font-size: 13px; font-weight: 600; color: #c4b5fd; margin: 2px 0; }
    .log-latency { font-size: 10px; color: #94a3b8; }
    .log-json {
      background: #0f172a;
      border-radius: 4px;
      padding: 6px 8px;
      margin-top: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 11px;
      color: #a8d8a8;
    }
    .log-json.err-json { color: #fca5a5; }
    .log-empty {
      color: #475569;
      font-style: italic;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Sticky Header: Device Indicator -->
<div id="header">
  <div id="conn-dot"></div>
  <h1>DCENT Connector v2 Playground</h1>
  <span id="device-info">Not connected</span>
  <!-- m09-04-03: transport option demo — per-call transport hint sent in _handshake -->
  <div id="transport-selector">
    <label for="select-transport">Transport</label>
    <select id="select-transport" title="Per-call transport hint passed to dcent.sign()">
      <option value="">(default)</option>
      <option value="hid">hid (WebHID)</option>
      <option value="ble">ble (WebBLE)</option>
    </select>
  </div>
  <button id="btn-connect">Connect</button>
  <button id="btn-disconnect">Disconnect</button>
</div>

<!-- Main: Sidebar + Log -->
<div id="main">

  <!-- Left Sidebar -->
  <div id="sidebar">
    <!-- Tree -->
    <div id="tree-panel"></div>

    <!-- Form (B1 pattern) -->
    <div id="form-panel">
      <h3 id="form-title">Select a method</h3>
      <div id="form-fields"></div>
      <button id="btn-send" disabled>Send</button>
    </div>
  </div>

  <!-- Right: Log Panel -->
  <div id="log-area">
    <div id="log-toolbar">
      <span>Request Log</span>
      <button id="btn-pause">Pause</button>
      <button id="btn-clear">Clear</button>
      <button id="btn-copy">Copy all</button>
    </div>
    <div id="log-scroll">
      <div class="log-empty" id="log-empty">No requests yet. Connect and select a method to start.</div>
    </div>
  </div>

</div>

<!-- v2 dist bundle (m08-01-05 D-02 A: window.dcent = entire module exports) -->
<script src="/dist/v2/dcent-web-connector.min.js"></script>
<!-- m08-01-05 (D-04 B align): default export object 별칭 — window.dcent = facade default
     이로써 playground이 dcent.getDeviceInfo() / dcent.sign(...) / dcent.getEthereumSignedTransaction(...)을
     v0.16.0 App이 require()로 받는 것과 동일한 shape으로 호출 -->
<script>window.dcent = (window.dcent && window.dcent.default) || window.dcent;</script>
<script src="/playground.js"></script>
</body>
</html>
