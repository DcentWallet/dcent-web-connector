<!DOCTYPE html>
<html><head><style>
:root{
  /* BRAND-ANCHOR:BEGIN */
  --brand-100:#E2E1FD; --brand-200:#927DFF; --brand-400:#C7C3FB;
  --brand:#7231ff;     --brand-600:#6422E6; --brand-900:#22003C;
  --brand-ink:#4F46E5; --brand-ink-lite:#ABA2FE; --on-brand:#0B0E14;
  /* BRAND-ANCHOR:END */
  --stray-brand:#7231ff;
  --bg:#0f0f10; --bg-2:#0a0d12; --panel:#1b1c1e; --panel-2:#161c24; --code-bg:#050506;
  --accent:var(--brand); --accent-soft:color-mix(in srgb,var(--brand) 25%,var(--bg));
}
:root{--toc-w:0px}
:root{--sidebar-w:0px}
a{color:var(--accent)}
.badge{background:var(--accent-soft)}
.flow .num .n{color:#fff}
.flow .num .n.c{background:var(--accent)}
</style></head>
<body>
<span class="dot" style="background:var(--accent)"></span>
</body></html>
