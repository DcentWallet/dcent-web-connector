<!DOCTYPE html>
<html><head><style>
:root{
  /* BRAND-ANCHOR:BEGIN */
  --brand-100:#F0EFFF; --brand-200:#D8D5FF; --brand-400:#B0A8FF;
  --brand:#FAFAFF;     --brand-600:#E5E0FF; --brand-900:#C8C0FF;
  --brand-ink:#8880FF; --brand-ink-lite:#A8A0FF; --on-brand:#1A1030;
  /* BRAND-ANCHOR:END */
  --bg:#000000; --bg-2:#010102; --panel:#020204; --panel-2:#030306; --code-bg:#000001;
  --accent:var(--brand); --accent-soft:color-mix(in srgb,var(--brand) 25%,var(--bg));
}
:root{--toc-w:0px}
:root{--sidebar-w:0px}
a{color:var(--accent)}
.badge{background:var(--accent-soft)}
.flow .num .n{color:#000000}
.flow .num .n.c{background:var(--accent)}
</style></head>
<body><span class="dot" style="background:var(--accent)"></span></body></html>
