<!DOCTYPE html>
<html><head><style>
:root{
  /* BRAND-ANCHOR:BEGIN */
  --brand-100:#F3FBE0; --brand-200:#C7EE8A; --brand-400:#A9E355;
  --brand:#90E01F;     --brand-600:#7EC11F; --brand-900:#3D5C0C;
  --brand-ink:#67A216; --brand-ink-lite:#84CE1C; --on-brand:#FFFFFF;
  /* BRAND-ANCHOR:END */
  --bg:#0f0f10; --bg-2:#0a0d12; --panel:#1b1c1e; --panel-2:#161c24; --code-bg:#050506;
  --accent:var(--brand); --accent-soft:color-mix(in srgb,var(--brand) 25%,var(--bg));
}
:root{--toc-w:0px}
:root{--sidebar-w:0px}
a{color:var(--accent)}
.badge{background:var(--accent-soft)}
.flow .num .n{color:var(--on-brand)}
.flow .num .n.c{background:var(--accent)}
</style></head>
<body>
<span class="dot" style="background:var(--accent)"></span>
</body></html>
